name: Build Nilsagor FM Hub APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o Nilsagor_FM_Hub_Native_FULL.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: - name: Fix Java and Kotlin JVM target
  working-directory: project
  run: |
    python3 - <<'PY'
    from pathlib import Path

    p = Path("app/build.gradle.kts")
    s = p.read_text()

    if "kotlinOptions" not in s:
        s = s.replace(
            "android {",
            """android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
"""
        )

    p.write_text(s)
    PY

- name: Build APK
  working-directory: project
  run: gradle assembleDebug
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nilsagor-FM-Hub-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
